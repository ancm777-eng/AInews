          ctx.clip();
          ctx.fillStyle = "rgba(56, 224, 106, 0.72)";
          ctx.fillRect(-s - 2, s - s * 2 * pct, s * 2 + 4, s * 2 * pct + 2);
          ctx.restore();
        }
        ctx.restore();

        // 4 Thick White Corner Brackets (matching video pads!)
        const k = 14;
        const drawCorners = (col, lw) => {
          ctx.strokeStyle = col;
          ctx.lineWidth = lw;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          // TL
          ctx.beginPath(); ctx.moveTo(-s, -s + k); ctx.lineTo(-s, -s); ctx.lineTo(-s + k, -s); ctx.stroke();
          // TR
          ctx.beginPath(); ctx.moveTo(s - k, -s); ctx.lineTo(s, -s); ctx.lineTo(s, -s + k); ctx.stroke();
          // BR
          ctx.beginPath(); ctx.moveTo(s, s - k); ctx.lineTo(s, s); ctx.lineTo(s - k, s); ctx.stroke();
          // BL
          ctx.beginPath(); ctx.moveTo(-s + k, s); ctx.lineTo(-s, s); ctx.lineTo(-s, s - k); ctx.stroke();
          // Subtle side chevrons < >
          ctx.beginPath(); ctx.moveTo(-s - 3, -5); ctx.lineTo(-s - 7, 0); ctx.lineTo(-s - 3, 5); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(s + 3, -5); ctx.lineTo(s + 7, 0); ctx.lineTo(s + 3, 5); ctx.stroke();
        };
        drawCorners("rgba(42, 24, 12, 0.78)", 6.4);
        drawCorners("#ffffff", 3.5);

        // Clean Icon-Only Upper Half (NO Korean text clutter inside camp pads!)
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#ffffff";
        const drawPlusBadge = (px, py) => {
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 4.2; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(px - 5, py); ctx.lineTo(px + 5, py); ctx.moveTo(px, py - 5); ctx.lineTo(px, py + 5); ctx.stroke();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(px - 5, py); ctx.lineTo(px + 5, py); ctx.moveTo(px, py - 5); ctx.lineTo(px, py + 5); ctx.stroke();
        };

        if (pad.iconType === "person") {
          // Crisp person bust silhouette + ratio (1/15)
          ctx.strokeStyle = "rgba(24,14,8,0.75)"; ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.arc(-13, -15, 5.2, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
          ctx.beginPath(); ctx.arc(-13, -2, 8.4, Math.PI, 0); ctx.closePath(); ctx.stroke(); ctx.fill();
          ctx.textAlign = "left"; ctx.font = "900 13px Pretendard, sans-serif";
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 3.2;
          ctx.strokeText(pad.getRatio(), -1, -6);
          ctx.fillText(pad.getRatio(), -1, -6);
        } else if (pad.iconType === "axe") {
          // Crisp white axe/pickaxe silhouette + "+" (matching video!)
          ctx.lineCap = "round";
          ctx.strokeStyle = "rgba(24,14,8,0.8)"; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-1, -16); ctx.stroke();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-1, -16); ctx.stroke();
          ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "rgba(24,14,8,0.8)"; ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.moveTo(-6, -18); ctx.quadraticCurveTo(5, -20, 4, -10); ctx.lineTo(-2, -13); ctx.closePath();
          ctx.stroke(); ctx.fill();
          drawPlusBadge(12, -10);
        } else if (pad.iconType === "bag") {
          // Crisp white satchel/pack + "+"
          ctx.strokeStyle = "rgba(24,14,8,0.8)"; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(-8, -17, 4.2, Math.PI, 0); ctx.stroke();
          drawRoundedRect(-16, -16, 16, 13, 3.2); ctx.stroke(); ctx.fill();
          ctx.fillStyle = "rgba(48,32,20,0.6)"; ctx.fillRect(-10, -11, 4, 3);
          drawPlusBadge(11, -10);
        } else if (pad.iconType === "cauldron") {
          // Crisp white stone hearth / bubbling pot silhouette + "+"
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 2.4;
          drawRoundedRect(-17, -15, 16, 12, 3); ctx.stroke(); ctx.fill();
          ctx.beginPath(); ctx.arc(-9, -15, 7, Math.PI, 0); ctx.stroke(); ctx.fill();
          ctx.fillStyle = "#ff9d3b";
          ctx.beginPath(); ctx.arc(-9, -8, 3.5, 0, Math.PI * 2); ctx.fill();
          drawPlusBadge(11, -10);
        } else if (pad.iconType === "refinery") {
          // Crisp white bubbling alembic flask + "+"
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(-8, -7, 7, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
          ctx.fillRect(-11, -19, 6, 8);
          drawPlusBadge(11, -10);
        } else if (pad.iconType === "turret") {
          // Star turret cannon silhouette + Lv
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 2.4;
          drawRoundedRect(-15, -12, 14, 9, 3); ctx.stroke(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(3, -18); ctx.lineWidth = 4; ctx.stroke();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(3, -18); ctx.stroke();
          drawPlusBadge(12, -10);
        } else if (pad.iconType === "cart") {
          // Auto cart silhouette + "+"
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 2.2;
          drawRoundedRect(-16, -15, 16, 9, 2.5); ctx.stroke(); ctx.fill();
          ctx.beginPath(); ctx.arc(-13, -5, 3, 0, Math.PI * 2); ctx.arc(-3, -5, 3, 0, Math.PI * 2); ctx.fill();
          drawPlusBadge(12, -10);
        } else {
          // Clean gate arch icon + zone number ("2F", "3F", "4F")
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(-9, -10, 6.5, Math.PI, 0); ctx.lineTo(-2.5, -4); ctx.lineTo(-15.5, -4); ctx.closePath(); ctx.stroke(); ctx.fill();
          ctx.textAlign = "left"; ctx.font = "900 13px Pretendard, sans-serif";
          ctx.strokeStyle = "rgba(24,14,8,0.85)"; ctx.lineWidth = 3.2;
          ctx.strokeText(pad.getRatio(), 2, -6);
          ctx.fillText(pad.getRatio(), 2, -6);
        }

        // Bottom Cost + Green Banknote / Crystal Icon
        if (!pad.isDone()) {
          ctx.textAlign = "right";
          ctx.font = "900 15px Pretendard, sans-serif";
          ctx.strokeStyle = "rgba(20,12,6,0.92)"; ctx.lineWidth = 3.8;
          ctx.strokeText(fmtNum(rem), 5, 16);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(fmtNum(rem), 5, 16);
          drawBillMini(18, 12, pad.currency === "crystals");
        } else {
          ctx.textAlign = "center";
          ctx.fillStyle = "#88ffb8";
          ctx.font = "900 12px Pretendard, sans-serif";
          ctx.fillText("✓ MAX", 0, 14);
        }
        ctx.restore();
      }

      function drawStationPinBadge(x, y, mode = "check", count = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#38261c";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-6, 13); ctx.lineTo(0, 22); ctx.lineTo(6, 13); ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Clean interior fill over join seam
        ctx.beginPath(); ctx.arc(0, 0, 14.2, 0, Math.PI * 2); ctx.fill();

        if (mode === "check") {
          ctx.fillStyle = "#25d95b";
          ctx.beginPath(); ctx.arc(0, 0, 11.2, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
          ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-1, 4.2); ctx.lineTo(5.8, -4.2); ctx.stroke();
        } else {
          // Green inner circular ring + miniature crimson brick + bold count (matching video's "2" badge!)
          ctx.strokeStyle = "#25d95b";
          ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.arc(0, 0, 11.8, 0, Math.PI * 2); ctx.stroke();
          drawIsoSlabTile(-5.2, 1.5, 9, 4.5, 2.5, "#f24b5c", "#a31e30", "#38121a", null);
          ctx.fillStyle = "#221a16";
          ctx.font = "900 11.5px Pretendard, sans-serif";
          ctx.textAlign = "left"; ctx.textBaseline = "middle";
          ctx.fillText(String(count), 2.5, 0.5);
        }
        ctx.restore();
      }

      function drawPalisadeLog(x, y, hVar = 0) {
        const h = 36 + hVar;
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = "rgba(42, 24, 10, 0.25)";
        ctx.beginPath(); ctx.ellipse(-3, 2, 10, 5, 0, 0, Math.PI * 2); ctx.fill();

        // Main vertical wooden shaft (thicker 15px cel-shaded log)
        ctx.fillStyle = "#cf8b4a";
        ctx.fillRect(-7.5, -h, 15, h);
        ctx.fillStyle = "#f0c188";
        ctx.fillRect(-7.5, -h, 5, h);
        ctx.fillStyle = "#995c26";
        ctx.fillRect(2.5, -h, 5, h);
        ctx.strokeStyle = "#4a280e"; ctx.lineWidth = 1.7;
        ctx.strokeRect(-7.5, -h, 15, h);

        // Conical pointed wooden top pointing straight UP
        ctx.fillStyle = "#fbe4c2";
        ctx.beginPath();
        ctx.moveTo(-7.5, -h);
        ctx.lineTo(0, -h - 13);
        ctx.lineTo(7.5, -h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#d99d64";
        ctx.beginPath();
        ctx.moveTo(0, -h - 13);
        ctx.lineTo(7.5, -h);
        ctx.lineTo(0, -h);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#4a280e"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-7.5, -h); ctx.lineTo(0, -h - 13); ctx.lineTo(7.5, -h); ctx.closePath(); ctx.stroke();

        // Soft snowdrift hugging base of palisade logs
        ctx.fillStyle = "#eef4fa";
        ctx.beginPath(); ctx.ellipse(-4, 2.5, 8.5, 4.2, -0.15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d7e4f2";
        ctx.beginPath(); ctx.ellipse(4.5, 3, 6.5, 3.4, 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawCampGateDoor(x, y, side) {
        ctx.save();
        ctx.translate(x, y);
        // Thick square timber gate pillar with snow cap
        ctx.fillStyle = "#8a4d1e";
        ctx.strokeStyle = "#3f200a"; ctx.lineWidth = 2;
        ctx.fillRect(-9, -42, 18, 42); ctx.strokeRect(-9, -42, 18, 42);
        ctx.fillStyle = "#f2f7fc";
        drawRoundedRect(-10, -47, 20, 7, 3); ctx.fill(); ctx.stroke();

        // Open cross-braced gate wing swung outward into snowfield
        const dx = side < 0 ? 20 : -20;
        const dy = -18;
        ctx.fillStyle = "#b86d2e";
        ctx.beginPath();
        ctx.moveTo(0, -32); ctx.lineTo(dx, dy - 32); ctx.lineTo(dx, dy); ctx.lineTo(0, 0); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#5c3416"; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(dx, dy - 21); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(dx, dy - 10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(dx, dy - 3); ctx.stroke();
        ctx.restore();
      }

      function drawFacetedBoulder(x, y, s = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        ctx.fillStyle = "rgba(86, 102, 126, 0.28)";
        ctx.beginPath(); ctx.ellipse(2, 12, 42, 16, 0, 0, Math.PI * 2); ctx.fill();

        // Main faceted rock body
        ctx.fillStyle = "#918984";
        ctx.strokeStyle = "#3b3430";
        ctx.lineWidth = 2.4;
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-36, 6); ctx.lineTo(-28, -28); ctx.lineTo(-4, -44); ctx.lineTo(26, -30); ctx.lineTo(38, 4); ctx.lineTo(14, 14); ctx.lineTo(-18, 14);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        // Right darker facet plane
        ctx.fillStyle = "#706864";
        ctx.beginPath();
        ctx.moveTo(-4, -44); ctx.lineTo(26, -30); ctx.lineTo(38, 4); ctx.lineTo(14, 14); ctx.lineTo(4, -12);
        ctx.closePath();
        ctx.fill();

        // Snow cap along top facets
        ctx.fillStyle = "#f4f8fc";
        ctx.beginPath();
        ctx.moveTo(-29, -22); ctx.lineTo(-28, -28); ctx.lineTo(-4, -44); ctx.lineTo(26, -30); ctx.lineTo(29, -17);
        ctx.quadraticCurveTo(10, -24, 0, -14);
        ctx.quadraticCurveTo(-14, -24, -29, -22);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#3b3430"; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }

      function drawDecorProp(d) {
        const unlocked = state.unlockedZones[d.zone];
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.scale(d.scale, d.scale);
        if (!unlocked) ctx.globalAlpha = 0.55;
        if (d.kind === "pine") {
          ctx.fillStyle = "rgba(88, 106, 130, 0.26)";
          ctx.beginPath(); ctx.ellipse(-4, 8, 22, 9, 0, 0, Math.PI * 2); ctx.fill();
          if (d.zone === 0) {
            // Bare reddish-brown winter tree with snow-dusted spreading branches (matches video!)
            ctx.fillStyle = "#8c4a2f";
            ctx.strokeStyle = "#361a10"; ctx.lineWidth = 2; ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(-7, 6);
            ctx.lineTo(-4.5, -26);
            ctx.lineTo(-22, -46); ctx.lineTo(-18, -49); ctx.lineTo(-3, -34);
            ctx.lineTo(-2, -62); ctx.lineTo(3, -62); ctx.lineTo(3, -38);
            ctx.lineTo(19, -52); ctx.lineTo(22, -48); ctx.lineTo(5, -28);
            ctx.lineTo(7, 6);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            // Snow caps perched on upward branches & crotch
            ctx.fillStyle = "#f4f8fc";
            ctx.strokeStyle = "#9eb2c9"; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.ellipse(-18, -49, 7, 3.2, -0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(17, -51, 7.5, 3.2, 0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.ellipse(0.5, -62, 6.5, 3.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          } else {
            // Zone 2-4 enchanted frost trees
            ctx.fillStyle = d.zone === 1 ? "#3e7868" : d.zone === 2 ? "#525894" : "#7d4a7a";
            ctx.strokeStyle = "#361a10"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-7, 6); ctx.lineTo(-2, -62); ctx.lineTo(2, -62); ctx.lineTo(7, 6); ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = d.zone === 1 ? "#59b89c" : d.zone === 2 ? "#7a8cde" : "#ba6ec2";
            ctx.beginPath(); ctx.moveTo(-19, -20); ctx.lineTo(0, -68); ctx.lineTo(19, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#f2f7fc";
            ctx.beginPath(); ctx.moveTo(-9, -46); ctx.lineTo(0, -68); ctx.lineTo(9, -46); ctx.quadraticCurveTo(0, -40, -9, -46); ctx.fill();
          }
        } else if (d.kind === "flower") {
          ctx.fillStyle = unlocked ? "#ffd4ec" : "#8994a6";
          ctx.beginPath(); ctx.arc(-4, 0, 3.8, 0, Math.PI * 2); ctx.arc(4, 2, 3.8, 0, Math.PI * 2); ctx.arc(0, -4, 3.8, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = unlocked ? "#9aa6b8" : "#6b7485";
          ctx.strokeStyle = "#3a404a"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }

      function drawWorldBackground() {
        // Crisp Arctic Snowfield Base (matches video's bright clean snow canvas!)
        ctx.fillStyle = "#e4ecf5";
        ctx.fillRect(0, 0, viewW, viewH);

        ctx.save();
        const zoom = getWorldZoom();
        const shakeX = camera.shake > 0 ? (Math.random() - 0.5) * camera.shake : 0;
        const shakeY = camera.shake > 0 ? (Math.random() - 0.5) * camera.shake : 0;
        ctx.scale(zoom, zoom);
        ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

        // Organic layered snowdrifts & frosted biome glades (keeping Zone 1 NE gate snowfield crisp white!)
        const biomeGlades = [
          { x: -720, y: 560, rx: 640, ry: 480, col: "#dce9e2", lockCol: "#c7d2e0", z: 0 },
          { x: -780, y: -740, rx: 580, ry: 420, col: "#cfe8e2", lockCol: "#bcc7d8", z: 1 },
          { x: 820, y: -740, rx: 580, ry: 420, col: "#d7def7", lockCol: "#bec7db", z: 2 },
          { x: 760, y: 600, rx: 640, ry: 480, col: "#e7d8f2", lockCol: "#c5cbe0", z: 3 }
        ];
        for (let i = 0; i < biomeGlades.length; i++) {
          const g = biomeGlades[i];
          if (!inView(g.x, g.y, g.rx + 120)) continue;
          ctx.fillStyle = state.unlockedZones[g.z] ? g.col : g.lockCol;
          ctx.globalAlpha = state.unlockedZones[g.z] ? 0.45 : 0.35;
          ctx.beginPath(); ctx.ellipse(g.x, g.y, g.rx, g.ry, 0, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }

        // Camp Isometric Parquet Floor
        drawCampParquetFloor();

        // White-framed Isometric Drop Mats for SELL & Refinery (no glaring neon box!)
        if (inView(VILLAGE.sellPad.x, VILLAGE.sellPad.y, 90)) {
          const onSell = Math.hypot(player.x - VILLAGE.sellPad.x, player.y - VILLAGE.sellPad.y) <= VILLAGE.sellPad.r + 14;
          drawIsoFloorMat(VILLAGE.sellPad.x, VILLAGE.sellPad.y, 32, onSell && state.inventory.length > 0);
          ctx.save();
          ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, VILLAGE.sellPad.x, VILLAGE.sellPad.y);
          ctx.textAlign = "center"; ctx.font = "900 12px Pretendard, sans-serif";
          ctx.strokeStyle = "rgba(42,24,12,0.8)"; ctx.lineWidth = 3;
          ctx.strokeText("SELL", 0, 4);
          ctx.fillStyle = "#ffffff";
          ctx.fillText("SELL", 0, 4);
          ctx.restore();
        }
        if (state.refineryBuilt && inView(VILLAGE.refineryPad.x, VILLAGE.refineryPad.y, 90)) {
          const onRef = Math.hypot(player.x - VILLAGE.refineryPad.x, player.y - VILLAGE.refineryPad.y) <= VILLAGE.refineryPad.r + 14;
          drawIsoFloorMat(VILLAGE.refineryPad.x, VILLAGE.refineryPad.y, 30, onRef && state.inventory.length > 0);
          ctx.save();
          ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, VILLAGE.refineryPad.x, VILLAGE.refineryPad.y);
          ctx.textAlign = "center"; ctx.font = "900 11px Pretendard, sans-serif";
          ctx.strokeStyle = "rgba(42,24,12,0.8)"; ctx.lineWidth = 3;
          ctx.strokeText(`${getRefineryMultiplier().toFixed(1)}x`, 0, 4);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(`${getRefineryMultiplier().toFixed(1)}x`, 0, 4);
          ctx.restore();
        }

        // Footstep blooming flowers on floor
        for (let i = 0; i < footstepPool.length; i++) {
          const f = footstepPool[i];
          if (!f.active || !inView(f.x, f.y, 24)) continue;
          const alpha = 1 - f.life / f.maxLife;
          const pop = Math.min(1, f.life * 7);
          ctx.save();
          ctx.globalAlpha = alpha * 0.9;
          ctx.translate(f.x, f.y);
          ctx.rotate(f.rot);
          ctx.fillStyle = f.color;
          const s = f.size * pop;
          for (let p = 0; p < f.petals; p++) {
            const a = (Math.PI * 2 * p) / f.petals;
            ctx.beginPath(); ctx.arc(Math.cos(a) * s * 0.7, Math.sin(a) * s * 0.7, s * 0.45, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = "#fff5a8";
          ctx.beginPath(); ctx.arc(0, 0, s * 0.38, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // Isometric Floor Upgrade Pads (with thick white corner brackets!)
        for (let i = 0; i < stepPads.length; i++) {
          const pad = stepPads[i];
          if (pad.requiresZone !== undefined && !state.unlockedZones[pad.requiresZone]) continue;
          if (pad.isDone() && (pad.turretBp || pad.id.startsWith("zone_") || pad.id.startsWith("cart_"))) continue;
          if (!inView(pad.x, pad.y, 95)) continue;
          drawIsoDiamondPad(pad);
        }

        // Player underfoot aura ring & 3D Lime Ground Guide Arrow (on floor plane)
        drawPlayerFloorAuraAndArrow();

        // Populate zero-GC Y-sort queue for true 2.5D depth sorting
        sortCount = 0;
        for (let i = 0; i < PALISADE_LOGS.length; i++) {
          const l = PALISADE_LOGS[i];
          if (inView(l.x, l.y, 70)) pushSortItem(l.y, SORT_KIND.LOG, l);
        }
        for (let i = 0; i < CAMP_GATE_DOORS.length; i++) {
          const g = CAMP_GATE_DOORS[i];
          if (inView(g.x, g.y, 80)) pushSortItem(g.y, SORT_KIND.GATE, g);
        }
        for (let i = 0; i < CAMP_BOULDERS.length; i++) {
          const b = CAMP_BOULDERS[i];
          if (inView(b.x, b.y, 90)) pushSortItem(b.y, SORT_KIND.BOULDER, b);
        }
        for (let i = 0; i < decorProps.length; i++) {
          const d = decorProps[i];
          if (inView(d.x, d.y, 80)) pushSortItem(d.y, SORT_KIND.DECOR, d);
        }
        if (inView(VILLAGE.cauldron.x, VILLAGE.cauldron.y, 150)) pushSortItem(VILLAGE.cauldron.y + 8, SORT_KIND.CAULDRON, null);
        if (inView(VILLAGE.sellCounter.x, VILLAGE.sellCounter.y, 160)) pushSortItem(VILLAGE.sellCounter.y + 8, SORT_KIND.SELL, null);
        if (inView(VILLAGE.gemZone.x, VILLAGE.gemZone.y, 160)) pushSortItem(VILLAGE.gemZone.y + 12, SORT_KIND.GEMPILE, null);
        if (inView(VILLAGE.refinery.x, VILLAGE.refinery.y, 150)) pushSortItem(VILLAGE.refinery.y + 8, SORT_KIND.REFINERY, null);

        for (let i = 0; i < resourceNodes.length; i++) {
          const n = resourceNodes[i];
          if (state.unlockedZones[n.zone] && n.respawnTimer <= 0 && inView(n.x, n.y, 70)) pushSortItem(n.y, SORT_KIND.RES, n);
        }
        for (let i = 0; i < bubbleFairies.length; i++) {
          if (state.rescuedBubbles[i]) continue;
          const bf = bubbleFairies[i];
          if (state.unlockedZones[bf.zone] && inView(bf.x, bf.y, 70)) pushSortItem(bf.y, SORT_KIND.BUBBLE, bf);
        }
        for (let i = 0; i < TURRET_PAD_BLUEPRINTS.length; i++) {
          const bp = TURRET_PAD_BLUEPRINTS[i];
          if (state.turrets[bp.id] && inView(bp.x, bp.y, 90)) pushSortItem(bp.y, SORT_KIND.TURRET, bp);
        }
        for (let i = 0; i < customers.length; i++) {
          const c = customers[i];
          if (inView(c.x, c.y, 60)) pushSortItem(c.y, SORT_KIND.CUSTOMER, c);
        }
        for (let i = 0; i < fairyWorkers.length; i++) {
          const f = fairyWorkers[i];
          if (inView(f.x, f.y, 70)) pushSortItem(f.y, SORT_KIND.FAIRY, f);
        }
        for (let i = 0; i < autoCarts.length; i++) {
          const cart = autoCarts[i];
          if (inView(cart.x, cart.y, 90)) pushSortItem(cart.y, SORT_KIND.CART, cart);
        }
        for (let i = 0; i < monsters.length; i++) {
          const m = monsters[i];
          if (inView(m.x, m.y, 110)) pushSortItem(m.y, SORT_KIND.MONSTER, m);
        }
        if (activeBoss && inView(activeBoss.x, activeBoss.y, 140)) pushSortItem(activeBoss.y, SORT_KIND.MONSTER, activeBoss);
        pushSortItem(player.y, SORT_KIND.PLAYER, player);

        // Sort slice cleanly in-place
        const activeSlice = sortList.slice(0, sortCount).sort((a, b) => a.y - b.y);
        for (let i = 0; i < activeSlice.length; i++) {
          const item = activeSlice[i];
          switch (item.kind) {
            case SORT_KIND.LOG: drawPalisadeLog(item.ref.x, item.ref.y, item.ref.hVar); break;
            case SORT_KIND.GATE: drawCampGateDoor(item.ref.x, item.ref.y, item.ref.side); break;
            case SORT_KIND.BOULDER: drawFacetedBoulder(item.ref.x, item.ref.y, item.ref.s); break;
            case SORT_KIND.DECOR: drawDecorProp(item.ref); break;
            case SORT_KIND.CAULDRON: drawCauldronStation(); break;
            case SORT_KIND.SELL: drawSellStation(); break;
            case SORT_KIND.GEMPILE: drawCashTowerPile(); break;
            case SORT_KIND.REFINERY: drawRefineryStation(); break;
            case SORT_KIND.RES: drawSingleResourceNode(item.ref); break;
            case SORT_KIND.BUBBLE: drawSingleBubbleFairy(item.ref); break;
            case SORT_KIND.TURRET: drawSingleTurret(item.ref); break;
            case SORT_KIND.CUSTOMER: drawSingleCustomer(item.ref); break;
            case SORT_KIND.FAIRY: drawSingleFairy(item.ref); break;
            case SORT_KIND.CART: drawSingleCart(item.ref); break;
            case SORT_KIND.MONSTER: drawSingleMonster(item.ref); break;
            case SORT_KIND.PLAYER: drawPlayer(); break;
          }
        }

        // Floating White Checkmark / Count Pin Badges (above stations!)
        if (inView(VILLAGE.cauldron.x, VILLAGE.cauldron.y, 160)) {
          drawStationPinBadge(VILLAGE.cauldron.x, VILLAGE.cauldron.y - 56, "check", 0);
        }
        if (inView(VILLAGE.sellCounter.x, VILLAGE.sellCounter.y, 160)) {
          drawStationPinBadge(VILLAGE.sellCounter.x, VILLAGE.sellCounter.y - 54, state.counterStock.length > 0 ? "count" : "check", state.counterStock.length);
        }
        if (state.refineryBuilt && inView(VILLAGE.refinery.x, VILLAGE.refinery.y, 160)) {
          drawStationPinBadge(VILLAGE.refinery.x, VILLAGE.refinery.y - 60, state.refineryQueue.length > 0 ? "count" : "check", state.refineryQueue.length);
        }

        drawCombatAndFX();
        drawFogOfWar();

        for (let i = 0; i < rainbowWaves.length; i++) {
          const w = rainbowWaves[i];
          ctx.save();
          ctx.globalAlpha = w.alpha;
          ctx.lineWidth = 26;
          ["#ff7eb9", "#ffbe7b", "#fff580", "#84f5a8", "#78dcff", "#c78cff"].forEach((col, ci) => {
            ctx.strokeStyle = col;
            ctx.beginPath(); ctx.arc(w.x, w.y, Math.max(4, w.radius - ci * 14), 0, Math.PI * 2); ctx.stroke();
          });
          ctx.restore();
        }

        ctx.restore();

        // Ambient Drifting Snow Particles (screen space)
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        for (let i = 0; i < SNOW_SPECKS.length; i++) {
          const sp = SNOW_SPECKS[i];
          const sx = ((sp.xRatio * viewW + state.playTime * sp.spX) % viewW + viewW) % viewW;
          const sy = ((sp.yRatio * viewH + state.playTime * sp.spY) % viewH + viewH) % viewH;
          ctx.beginPath(); ctx.arc(sx, sy, sp.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }

      function drawIsoSlabTile(x, y, w, d, h, topCol, frontCol, outlineCol = "#2e1812", coreDot = null) {
        ctx.fillStyle = frontCol;
        ctx.strokeStyle = outlineCol;
        ctx.lineWidth = 1.1;
        drawRoundedRect(x - w * 0.5, y - h, w, d + h, 2.5);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = topCol;
        drawRoundedRect(x - w * 0.5, y - h - 1, w, d, 2.5);
        ctx.fill(); ctx.stroke();
        if (coreDot) {
          ctx.fillStyle = coreDot;
          ctx.beginPath(); ctx.ellipse(x, y - h - 1 + d * 0.5, w * 0.24, d * 0.28, 0, 0, Math.PI * 2); ctx.fill();
        }
      }

      function drawFurHoodCharacter(opts) {
        const {
          x, y, facing = 1, walkPhase = 0,
          cloakColor = "#1cb2e8", shadeColor = "#117fa8", hoodColor = "#f7f5ef",
          isPlayer = false, tier = 1, moving = false, facingBack = false
        } = opts;
        const bob = moving ? Math.abs(Math.sin(walkPhase)) * 3.0 : 0;
        const legSwing = moving ? Math.sin(walkPhase) * 3.6 : 0;

        ctx.save();
        ctx.translate(x, y);

        // Ground shadow
        ctx.fillStyle = "rgba(38, 22, 12, 0.25)";
        ctx.beginPath(); ctx.ellipse(0, 11, 13.5, 5.8, 0, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.translate(0, -bob);

        // Subtle Celestial wings at Tier 5 endgame evolution
        if (isPlayer && tier >= 5) {
          ctx.fillStyle = "rgba(255, 244, 254, 0.9)";
          ctx.strokeStyle = "#4d2c4a"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.ellipse(-18, -5, 11, 5.5, -0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.ellipse(18, -5, 11, 5.5, 0.45, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }

        // Stubby dark winter boots
        ctx.fillStyle = "#36241d";
        ctx.strokeStyle = "#1c120d"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(-5.2, 9 + legSwing, 4.1, 2.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(5.2, 9 - legSwing, 4.1, 2.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Winter Parka Coat (trapezoid silhouette + cel shade + cream fur lower trim)
        ctx.fillStyle = cloakColor;
        ctx.strokeStyle = "#241712"; ctx.lineWidth = 2; ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(-12.5, 8); ctx.lineTo(-9.5, -10); ctx.lineTo(9.5, -10); ctx.lineTo(12.5, 8);
        ctx.quadraticCurveTo(0, 11, -12.5, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = shadeColor;
        ctx.beginPath();
        ctx.moveTo(2, -10); ctx.lineTo(9.5, -10); ctx.lineTo(12.5, 8); ctx.lineTo(2.5, 9.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Lower Cream Fur Hem Trim
        ctx.fillStyle = hoodColor;
        drawRoundedRect(-12, 4.5, 24, 4.4, 2.2);
        ctx.fill(); ctx.stroke();

        if (facingBack) {
          // 3/4 Back View: diagonal strap + fluffy white fur collar + rounded parka hood dome (no eyes!)
          ctx.strokeStyle = "#4d2f20"; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(9, 4); ctx.stroke();
          ctx.fillStyle = hoodColor;
          ctx.strokeStyle = "#241712"; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.ellipse(0, -6.5, 11.5, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Rounded cloth hood back dome
          ctx.fillStyle = cloakColor;
          ctx.beginPath(); ctx.arc(0, -16, 12.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = shadeColor;
          ctx.beginPath(); ctx.arc(3, -15, 9.8, -Math.PI * 0.4, Math.PI * 0.6); ctx.fill();
        } else {
          // Front/Side View: White Mittens + Scalloped Cream Fur Hood + Chibi Peach Face
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "#241712"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(facing * -9.5, 0.5, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(facing * 10.5, 0.5, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Fluffy Scalloped Fur Hood Rim
          ctx.fillStyle = hoodColor;
          ctx.strokeStyle = "#241712"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, -15, 13.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(-9.2, -12.5, 5.0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(9.2, -12.5, 5.0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Parka Hood Crown matching jacket color (rounded winter hood - NO pointy witch cone!)
          ctx.fillStyle = cloakColor;
          ctx.beginPath(); ctx.arc(0, -17.5, 12.2, Math.PI * 0.98, Math.PI * 2.02); ctx.closePath(); ctx.fill(); ctx.stroke();
          if (isPlayer && tier >= 2) {
            // Tier star emblem stitched onto hood crest
            ctx.fillStyle = tier >= 4 ? "#ff84e8" : "#ffe66d";
            ctx.beginPath(); ctx.arc(facing * 4, -22, 3.1, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#241712"; ctx.lineWidth = 1.2; ctx.stroke();
          }

          // Peach Face Opening
          ctx.fillStyle = "#ffe2c8";
          ctx.beginPath(); ctx.ellipse(facing * 1.5, -13.5, 9.0, 8.0, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#241712"; ctx.lineWidth = 1.6; ctx.stroke();

          // Eyes & Blush
          ctx.fillStyle = "#24192b";
          ctx.beginPath();
          ctx.arc(facing * 3 - 2.5, -13.8, 1.75, 0, Math.PI * 2);
          ctx.arc(facing * 3 + 3.1, -13.8, 1.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "rgba(255, 132, 152, 0.55)";
          ctx.beginPath();
          ctx.ellipse(facing * 3 - 4.7, -11.3, 2.1, 1.1, 0, 0, Math.PI * 2);
          ctx.ellipse(facing * 3 + 5.1, -11.3, 2.1, 1.1, 0, 0, Math.PI * 2);
          ctx.fill();

          // Player Harvesting Crystal Pickaxe / Magic Staff in hand
          if (isPlayer) {
            const wx = facing * 12;
            ctx.strokeStyle = tier >= 3 ? "#eab844" : "#754624";
            ctx.lineWidth = 3.2; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(wx, 3); ctx.lineTo(wx + facing * 10, -14 - tier * 0.6); ctx.stroke();
            // Pick / crystal crescent blade head
            ctx.fillStyle = tier >= 4 ? "#ff82ea" : "#70ecff";
            ctx.strokeStyle = "#1d2d44"; ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(wx + facing * 5, -17 - tier * 0.6);
            ctx.quadraticCurveTo(wx + facing * 15, -18 - tier * 0.6, wx + facing * 14, -7 - tier * 0.6);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
          }
        }
        ctx.restore();
        ctx.restore();
      }

      function drawCauldronStation() {
        const cx = VILLAGE.cauldron.x, cy = VILLAGE.cauldron.y;
        ctx.save();
        ctx.translate(cx, cy);

        // 1. Left Wooden Input Pallet + 9-layer crisp white & cyan slab stack (matching video!)
        ctx.save();
        ctx.translate(-62, 6);
        ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, 0, 0);
        ctx.fillStyle = "#9c602c"; ctx.strokeStyle = "#4d2b10"; ctx.lineWidth = 2;
        drawRoundedRect(-20, -16, 40, 32, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#d99e63";
        for (let r = -12; r <= 8; r += 9) ctx.fillRect(-17, r, 34, 6);
        ctx.restore();
        for (let s = 0; s < 9; s++) {
          drawIsoSlabTile(-62, 4 - s * 4.2, 22, 8.5, 3.6, "#f4f8fc", "#b4cbe0", "#3a4554", "#63d8ff");
        }

        // 2. Right White-Bordered Worker Mat + Red Fur-Hooded Camp Assistant + Crimson Stack
        drawIsoFloorMat(48, 8, 22, false);
        drawFurHoodCharacter({ x: 46, y: 0, facing: -1, cloakColor: "#df524c", shadeColor: "#a82d28", hoodColor: "#f7f5ef" });
        for (let c = 0; c < 5; c++) {
          drawIsoSlabTile(66, 6 - c * 4.0, 15, 7, 3.4, "#f44e5e", "#9c1f2e", "#2d1218", "#ff9ea8");
        }

        // 3. Blazing Stone-and-Wood Furnace Hearth + Steaming Golden Kettle (matching video!)
        ctx.fillStyle = "rgba(42, 24, 12, 0.28)";
        ctx.beginPath(); ctx.ellipse(0, 22, 44, 16, 0, 0, Math.PI * 2); ctx.fill();

        // Main stone hearth body
        ctx.fillStyle = "#7a7d8a"; ctx.strokeStyle = "#2d2a32"; ctx.lineWidth = 2.2;
        drawRoundedRect(-30, -12, 60, 32, 7); ctx.fill(); ctx.stroke();
        // Darker top stone mantle ledge
        ctx.fillStyle = "#9498a6";
        drawRoundedRect(-32, -16, 64, 10, 4); ctx.fill(); ctx.stroke();
        // Warm wood fuel log bundle on right side
        ctx.fillStyle = "#8f5324"; ctx.strokeStyle = "#3d200a"; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(20, 6, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(25, 11, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // Open arched firebox with blazing animated flames & iron grate bars
        ctx.fillStyle = "#281816";
        drawRoundedRect(-17, -4, 28, 22, 7); ctx.fill(); ctx.stroke();
        const flamePulse = Math.sin(state.playTime * 11) * 2.0;
        ctx.fillStyle = "#ff5a1f";
        ctx.beginPath();
        ctx.moveTo(-14, 17); ctx.quadraticCurveTo(-8, -2 - flamePulse, -3, 10);
        ctx.quadraticCurveTo(3, -3 + flamePulse, 9, 17); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ffa62b";
        ctx.beginPath();
        ctx.moveTo(-11, 17); ctx.quadraticCurveTo(-3, 2 + flamePulse * 0.7, 6, 17); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#fff199";
        ctx.beginPath(); ctx.arc(-3, 13, 5.2, 0, Math.PI * 2); ctx.fill();
        // 3 dark iron grate bars in front of flames
        ctx.strokeStyle = "#1c1416"; ctx.lineWidth = 2.2;
        for (let gx = -11; gx <= 5; gx += 8) {
          ctx.beginPath(); ctx.moveTo(gx, -3); ctx.lineTo(gx, 17); ctx.stroke();
        }

        // Low-profile golden alchemy stewpot / cauldron atop the hearth mantle
        const grad = ctx.createRadialGradient(-8, -28, 3, 0, -24, 28);
        grad.addColorStop(0, "#fff099"); grad.addColorStop(0.55, "#e8a430"); grad.addColorStop(1, "#9c5c16");
        ctx.fillStyle = grad; ctx.strokeStyle = "#3d220a"; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.ellipse(0, -22, 25, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = `hsl(${(state.playTime * 65) % 360}, 88%, 68%)`;
        ctx.beginPath(); ctx.ellipse(0, -32, 18, 6.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#ffe99e"; ctx.lineWidth = 1.8; ctx.stroke();
        ctx.restore();
      }

      function drawSellStation() {
        const sx = VILLAGE.sellCounter.x, sy = VILLAGE.sellCounter.y;
        ctx.save();
        ctx.translate(sx, sy);

        // White-bordered cashier mat + Red-Hooded Cashier Behind Counter
        drawIsoFloorMat(-20, -20, 20, false);
        drawFurHoodCharacter({ x: -20, y: -26, facing: 1, cloakColor: "#df524c", shadeColor: "#a82d28", hoodColor: "#f7f5ef" });

        // 2:1 Isometric Compact Slatted Pine Sales Counter matching video
        ctx.fillStyle = "rgba(42, 24, 12, 0.24)";
        ctx.beginPath(); ctx.ellipse(0, 14, 48, 19, 0, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, 0, 0);
        // 3D front apron & legs
        ctx.fillStyle = "#b06f32"; ctx.strokeStyle = "#45240c"; ctx.lineWidth = 2.2;
        drawRoundedRect(-14, -36, 32, 82, 6); ctx.fill(); ctx.stroke();
        // Top slatted honey-pine counter surface
        ctx.fillStyle = "#ecc588";
        drawRoundedRect(-18, -40, 32, 80, 6); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "rgba(110, 62, 22, 0.38)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-7, -40); ctx.lineTo(-7, 40); ctx.moveTo(4, -40); ctx.lineTo(4, 40); ctx.stroke();
        ctx.restore();

        // Stacked 3D crimson/potion display slabs piled neatly on counter (at least 2 crisp items if empty)
        const showCount = state.counterStock.length > 0 ? Math.min(24, state.counterStock.length) : 2;
        for (let i = 0; i < showCount; i++) {
          const item = state.counterStock[i];
          const stackIdx = i % 2;
          const tierIdx = Math.floor(i / 2);
          const res = !item
            ? { color: "#f24b5c", topColor: "#ffe5ea" }
            : (typeof item === "string" ? RESOURCES[item] : { color: "#ff87e8", topColor: "#fff4b0" });
          const px = -11 + stackIdx * 18;
          const py = 0 - stackIdx * 8 - tierIdx * 4.4;
          drawIsoSlabTile(px, py, 15, 6.5, 3.8, res.color, res.topColor === "#ffe5ea" ? "#9e2336" : "#3a6ea8", "#2d1419", "#ffffff");
        }
        ctx.restore();
      }

      function drawCashTowerPile() {
        const gx = VILLAGE.gemZone.x, gy = VILLAGE.gemZone.y;
        ctx.save();
        ctx.translate(gx, gy);

        // Dark translucent collection square with crisp white border under banknote towers
        ctx.save();
        ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, 0, 0);
        ctx.fillStyle = "rgba(38, 28, 20, 0.42)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.72)"; ctx.lineWidth = 2;
        drawRoundedRect(-26, -26, 52, 52, 9); ctx.fill(); ctx.stroke();
        ctx.restore();

        // Render at least 6 stacked green $ bills by default, scaling up to 32 bills tall when uncollectedGems > 0
        const billCount = state.uncollectedGems > 0
          ? Math.min(32, Math.max(6, Math.ceil(Math.sqrt(state.uncollectedGems) * 1.4)))
          : 6;
        const cols = 4;
        for (let i = 0; i < billCount; i++) {
          const col = i % cols;
          const tier = Math.floor(i / cols);
          const bx = -16 + (col % 2) * 18 + Math.floor(col / 2) * 8;
          const by = 8 + Math.floor(col / 2) * 8 - tier * 5.2;
          const isTopLayer = i >= billCount - cols;
          ctx.save();
          ctx.translate(bx, by);
          if (isTopLayer) ctx.rotate((col % 2 === 0 ? -0.14 : 0.16));
          drawIsoSlabTile(0, 0, 18, 8.5, 4.0, "#4fe882", "#1c823d", "#0e421f", null);
          ctx.fillStyle = "#126e32";
          ctx.font = "900 8px Pretendard, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("$", 0, -1.5);
          ctx.restore();
        }

        if (state.uncollectedGems > 0) {
          const topH = Math.ceil(billCount / cols) * 5.2 + 12;
          ctx.textAlign = "center"; ctx.font = "900 13px Pretendard, sans-serif";
          ctx.strokeStyle = "#0b2e16"; ctx.lineWidth = 3.5;
          ctx.strokeText(`+${fmtNum(state.uncollectedGems)}`, 2, -topH);
          ctx.fillStyle = "#ffffff";
          ctx.fillText(`+${fmtNum(state.uncollectedGems)}`, 2, -topH);
        }
        ctx.restore();
      }

        function drawRefineryStation() {
          const rx = VILLAGE.refinery.x, ry = VILLAGE.refinery.y;
          ctx.save();
          ctx.translate(rx, ry);
          if (!state.refineryBuilt) {
            // Clean Isometric Blueprint Construction Plot on Parquet Floor
            ctx.save();
            ctx.transform(ISO_UX, ISO_UY, ISO_VX, ISO_VY, 0, 0);
            ctx.fillStyle = "rgba(88, 56, 30, 0.24)";
            drawRoundedRect(-32, -32, 64, 64, 10);
            ctx.fill();
            ctx.setLineDash([7, 5]);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.72)";
            ctx.lineWidth = 2.4;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
            // Subtle flask silhouette outline inside blueprint
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            ctx.strokeStyle = "rgba(62, 34, 18, 0.65)";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-4, -14); ctx.lineTo(4, -14); ctx.lineTo(4, -7);
            ctx.lineTo(11, 5); ctx.quadraticCurveTo(12, 10, 0, 10);
            ctx.quadraticCurveTo(-12, 10, -11, 5); ctx.lineTo(-4, -7);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.restore();
            return;
          }

          ctx.fillStyle = "rgba(42, 24, 12, 0.24)";

      function drawSingleMonster(e) {
        ctx.save();
        ctx.translate(e.x, e.y);

        // Ground shadow

        ctx.beginPath(); ctx.ellipse(0, e.radius * 0.85, e.radius * 0.95, e.radius * 0.4, 0, 0, Math.PI * 2); ctx.fill();

        const flashHit = e.flash > 0;
        const slowIce = e.slowTimer > 0;
        ctx.strokeStyle = "#2b2229";
        ctx.lineWidth = e.isBoss ? 3.2 : 2.2;
        ctx.lineJoin = "round";

        if (!e.isBoss && e.zone === 0) {
          // Plump 3/4 Cream-White Polar Bear Quadruped (matching video's bears outside NE gate!)
          const r = e.radius;
          const bodyCol = flashHit ? "#ffffff" : (slowIce ? "#8eeeff" : "#faf8f5");
          const shadeCol = flashHit ? "#ffffff" : (slowIce ? "#58d4f0" : "#d4ccc2");
          const dir = e.x > player.x ? -1 : 1;
          ctx.save();
          ctx.scale(dir, 1);

          // Far legs
          ctx.fillStyle = shadeCol;
          ctx.beginPath(); ctx.ellipse(-r * 0.42, r * 0.56, r * 0.24, r * 0.26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.ellipse(r * 0.36, r * 0.58, r * 0.24, r * 0.24, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Plump hunched torso + warm grey-beige rear/belly cel shadow
          ctx.fillStyle = bodyCol;
          ctx.beginPath();
          ctx.ellipse(-r * 0.14, r * 0.04, r * 0.78, r * 0.62, -0.1, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = shadeCol;
          ctx.beginPath();
          ctx.ellipse(-r * 0.24, r * 0.22, r * 0.64, r * 0.36, -0.1, 0.1, Math.PI * 0.95);
          ctx.fill();
          // Fluffy nub tail
          ctx.fillStyle = bodyCol;
          ctx.beginPath(); ctx.arc(-r * 0.88, -r * 0.08, r * 0.18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Near legs
          ctx.fillStyle = bodyCol;
          ctx.beginPath(); ctx.ellipse(-r * 0.52, r * 0.64, r * 0.26, r * 0.28, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.ellipse(r * 0.22, r * 0.66, r * 0.25, r * 0.27, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // Round Polar Bear Head + Rounded Ears + Blunt Snout
          ctx.fillStyle = bodyCol;
          ctx.beginPath(); ctx.arc(r * 0.36, -r * 0.44, r * 0.18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(r * 0.68, -r * 0.42, r * 0.18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = bodyCol;
          ctx.beginPath(); ctx.ellipse(r * 0.54, -r * 0.18, r * 0.44, r * 0.38, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Muzzle
          ctx.fillStyle = "#fffefe";
          ctx.beginPath(); ctx.ellipse(r * 0.86, -r * 0.12, r * 0.22, r * 0.16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Black button nose & angry eye
          ctx.fillStyle = "#241d21";
          ctx.beginPath(); ctx.ellipse(r * 1.01, -r * 0.16, r * 0.10, r * 0.075, 0, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(r * 0.68, -r * 0.24, r * 0.08, 0, Math.PI * 2); ctx.fill();
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(r * 0.56, -r * 0.34); ctx.lineTo(r * 0.78, -r * 0.28); ctx.stroke();
          ctx.restore();
        } else {
          // Cel-shaded Monsters (Golems, Bats, Pumpkins & Giant Crowned Bosses)
          if (!e.isBoss && e.zone === 2) {
            const flap = Math.sin(state.playTime * 14 + e.x) * 8;
            ctx.fillStyle = "#9562eb";
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-e.radius * 1.4, -10 + flap); ctx.lineTo(-e.radius * 1.1, 10 + flap * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(e.radius * 1.4, -10 + flap); ctx.lineTo(e.radius * 1.1, 10 + flap * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
          }
          ctx.fillStyle = flashHit ? "#ffffff" : (slowIce ? "#7de8ff" : e.color);
          ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "rgba(0,0,0,0.14)";
          ctx.beginPath(); ctx.arc(e.radius * 0.15, e.radius * 0.15, e.radius * 0.72, 0.2, Math.PI * 0.9); ctx.fill();

          ctx.fillStyle = "#22182b";
          const eyeOff = e.radius * 0.32;
          ctx.beginPath(); ctx.arc(-eyeOff, -2, e.radius * 0.13, 0, Math.PI * 2); ctx.arc(eyeOff, -2, e.radius * 0.13, 0, Math.PI * 2); ctx.fill();

          if (e.isBoss) {
            ctx.fillStyle = "#ffe066";
            ctx.beginPath(); ctx.moveTo(-22, -e.radius + 4); ctx.lineTo(-14, -e.radius - 18); ctx.lineTo(0, -e.radius - 6); ctx.lineTo(14, -e.radius - 18); ctx.lineTo(22, -e.radius + 4); ctx.closePath();
            ctx.fill(); ctx.stroke();

        // Bright Green HP Bar with Dark Border (matching video!)
        if (e.hp < e.maxHp || e.isBoss) {

          ctx.fillStyle = "#3ce868";
          drawRoundedRect(-bw / 2, -e.radius - 17.5, bw * Math.max(0, e.hp / e.maxHp), 5, 2); ctx.fill();
        }
        ctx.restore();
      }

      function drawPlayerFloorAuraAndArrow() {

          ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.arc(0, 0, 21 + tier * 1.5, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();

        // Extruded Lime-Green 3D Floor Arrow on perimeter ring pointing to objective!
        let tx = 290, ty = -85;
        if (activeBoss) { tx = activeBoss.x; ty = activeBoss.y; }
        else if (state.inventory.length >= getMaxBackpack() || (state.inventory.length >= 6 && Math.hypot(player.x, player.y) < 420)) {
          tx = VILLAGE.sellPad.x; ty = VILLAGE.sellPad.y;
        } else if (state.uncollectedGems >= 20 && Math.hypot(player.x, player.y) < 420) {
          tx = VILLAGE.gemZone.x; ty = VILLAGE.gemZone.y;
        }
        const dx = tx - player.x, dy = ty - player.y, d = Math.hypot(dx, dy);
        if (d < 70) return;
        const ang = Math.atan2(dy, dx);
        const ax = player.x + Math.cos(ang) * 46;
        const ay = player.y + Math.sin(ang) * 38;

        ctx.save();
        ctx.translate(ax, ay);
        ctx.rotate(ang);
        ctx.lineJoin = "round";
        // Dark green 3D extrusion base
        ctx.fillStyle = "#1c8014";
        ctx.strokeStyle = "#103d0c"; ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(15, 4); ctx.lineTo(-4, -9); ctx.lineTo(-4, -2); ctx.lineTo(-14, -2);
        ctx.lineTo(-14, 9); ctx.lineTo(-4, 9); ctx.lineTo(-4, 15); ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Vivid lime top arrow face
        ctx.fillStyle = "#66f54c";
        ctx.beginPath();
        ctx.moveTo(15, 0); ctx.lineTo(-4, -12); ctx.lineTo(-4, -5); ctx.lineTo(-14, -5);
        ctx.lineTo(-14, 5); ctx.lineTo(-4, 5); ctx.lineTo(-4, 12); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.restore();

      function drawPlayer() {
        const tier = getWizardVisualTier();
        const moving = Math.hypot(player.vx, player.vy) > 20;
        const cloakColors = ["#1cb2e8", "#4b7bf5", "#e66bb0", "#6945db", "#ff6eb8"];
        const shadeColors = ["#117fa8", "#2f52bd", "#b34382", "#4727ad", "#cc4189"];

        // 1. Draw Chibi Fur-Hooded Survivalist Protagonist
        drawFurHoodCharacter({
          x: player.x, y: player.y,
          facing: player.facing,
          walkPhase: player.walkPhase,
          moving,
          cloakColor: cloakColors[tier - 1],
          shadeColor: shadeColors[tier - 1],
          hoodColor: "#f7f5ef",
          isPlayer: true,
          tier
        });

        // 2. Tall Narrow Skyscraper Ribbed Slab Stack Behind Player (Swaying with Spring Physics!)
        const totalBag = state.inventory.length;
        if (totalBag > 0) {
          ctx.save();
          ctx.translate(player.x, player.y);
          const maxBlocks = Math.min(75, totalBag);
          const sliceH = 3.2;
          const backX = -player.facing * 14;
          for (let i = 0; i < maxBlocks; i++) {
            const idx = Math.floor((i / maxBlocks) * totalBag);
            const item = state.inventory[idx];
            const res = typeof item === "string" ? RESOURCES[item] : { color: "#ff87e8", topColor: "#fff4b0" };
            const ratio = (i + 1) / maxBlocks;
            const swayX = player.stackInertiaX * Math.pow(ratio, 1.45) + Math.sin(state.playTime * 5.5 - i * 0.18) * (Math.hypot(player.vx, player.vy) * 0.008 * ratio);
            const swayY = player.stackInertiaY * Math.pow(ratio, 1.3);
            const bx = backX + swayX;
            const by = -10 - i * sliceH + swayY;
            const sideCol = res.shape === "crystal" ? "#267fa6" : "#9c1e32";
            drawIsoSlabTile(bx, by, 18, 8.5, sliceH - 0.5, res.color, sideCol, "#291016", res.topColor);
          }

          // Adjacent shorter vertical column of 3D green $ bills when carrying/collecting cash
          if (state.gems > 0 || player.cashVisTimer > 0) {
            const bx = backX - player.facing * 16 + player.stackInertiaX * 0.55;
            const cashCount = player.cashVisTimer > 0 ? 11 : Math.min(8, Math.max(2, Math.floor(Math.log10(state.gems + 1) * 3)));
            for (let c = 0; c < cashCount; c++) {
              drawIsoSlabTile(bx, -10 - c * 3.8, 15, 7, 3.2, "#52e882", "#1a7d3a", "#0c3d1c", "#1a7d3a");
            }
          }

          const isFull = totalBag >= getMaxBackpack();
          const topX = backX + player.stackInertiaX;
          const topY = -20 - maxBlocks * sliceH + player.stackInertiaY;
          ctx.fillStyle = isFull ? "rgba(204, 38, 68, 0.94)" : "rgba(20, 26, 38, 0.86)";
          drawRoundedRect(topX - (isFull ? 32 : 20), topY - 12, isFull ? 64 : 40, 16, 8); ctx.fill();
          ctx.fillStyle = isFull ? "#ffffff" : "#ffe875";
          ctx.textAlign = "center"; ctx.font = "900 10px Pretendard, sans-serif";
          ctx.fillText(isFull ? `가득 x${totalBag}` : `x${totalBag}`, topX, topY - 0.5);
          ctx.restore();
        }
      }

      function drawCombatAndFX() {
        for (let i = 0; i < projectilePool.length; i++) {
          const p = projectilePool[i];
          if (!p.active || !inView(p.x, p.y, 40)) continue;
          ctx.fillStyle = p.color; ctx.strokeStyle = "#2b1c24"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.45, 0, Math.PI * 2); ctx.fill();
        }
        for (let i = 0; i < lightningPool.length; i++) {
          const l = lightningPool[i];
          if (!l.active || l.points.length < 2) continue;
          ctx.save();
          ctx.globalAlpha = 1 - l.life / l.maxLife;
          ctx.strokeStyle = l.color; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(l.points[0].x, l.points[0].y);
          for (let k = 1; k < l.points.length; k++) {
            ctx.lineTo((l.points[k - 1].x + l.points[k].x) * 0.5 + (Math.random() - 0.5) * 14, (l.points[k - 1].y + l.points[k].y) * 0.5 + (Math.random() - 0.5) * 14);
            ctx.lineTo(l.points[k].x, l.points[k].y);
          }
          ctx.stroke();
          ctx.restore();
        }
        // Tapered Crimson-Red Crescent Hit Slashes matching video!
        for (let i = 0; i < slashPool.length; i++) {
          const s = slashPool[i];
          if (!s.active || !inView(s.x, s.y, 40)) continue;
          ctx.save();
          ctx.globalAlpha = 1 - s.life / s.maxLife;
          ctx.translate(s.x, s.y);
          ctx.rotate(s.angle);
          ctx.strokeStyle = "#ff2b44"; ctx.lineWidth = 5; ctx.lineCap = "round";
          ctx.beginPath(); ctx.arc(0, 0, 20, -0.85, 0.85); ctx.stroke();
          ctx.strokeStyle = "#ffeef0"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 19.5, -0.5, 0.5); ctx.stroke();
          ctx.restore();
        }
        for (let i = 0; i < flyingItemPool.length; i++) {
          const f = flyingItemPool[i];
          if (!f.active) continue;
          const t = f.progress;
          const x = f.sx + (f.tx - f.sx) * t;
          const y = f.sy + (f.ty - f.sy) * t - Math.sin(t * Math.PI) * f.arcHeight;
          if (!inView(x, y, 40)) continue;
          ctx.fillStyle = f.color; ctx.strokeStyle = "#2b161c"; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = f.topColor; ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 2.5, 0, Math.PI * 2); ctx.fill();
        }
        for (let i = 0; i < particlePool.length; i++) {
          const p = particlePool[i];
          if (!p.active || !inView(p.x, p.y, 30)) continue;
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
          ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        for (let i = 0; i < floatTextPool.length; i++) {
          const t = floatTextPool[i];
          if (!t.active || !inView(t.x, t.y, 80)) continue;
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - t.life / t.maxLife);
          ctx.textAlign = "center";
          ctx.font = `900 ${Math.round(12 * t.scale)}px Pretendard, sans-serif`;
          ctx.strokeStyle = "#161a2e"; ctx.lineWidth = 3;
          ctx.strokeText(t.text, t.x, t.y);
          ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
          ctx.restore();
        }
      }

      function drawFogOfWar() {
        for (let i = 0; i < fogPuffs.length; i++) {
          const fp = fogPuffs[i];
          if (state.unlockedZones[fp.zone] || !inView(fp.x, fp.y, fp.r)) continue;
          const drift = Math.sin(state.playTime * 0.6 + fp.phase) * 14;
          ctx.fillStyle = "rgba(186, 200, 222, 0.58)";
          ctx.beginPath(); ctx.arc(fp.x + drift, fp.y, fp.r, 0, Math.PI * 2); ctx.fill();
        }
        ZONES.forEach((z, zi) => {
          if (state.unlockedZones[zi]) return;
          const mc = z.mistCenter;
          if (!inView(mc.x, mc.y, 240)) return;
          ctx.save();
          ctx.textAlign = "center";
          ctx.fillStyle = "rgba(22, 30, 46, 0.84)";
          drawRoundedRect(mc.x - 115, mc.y - 30, 230, 56, 14); ctx.fill();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.45)"; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.fillStyle = "#ffffff"; ctx.font = "900 15px Pretendard, sans-serif";
          ctx.fillText(`🔒 ${z.name}`, mc.x, mc.y - 6);
          ctx.fillStyle = "#ffe285"; ctx.font = "800 12px Pretendard, sans-serif";
          ctx.fillText(`입구 발판에서 ${fmtNum(z.unlockCost)}으로 개방`, mc.x, mc.y + 15);
          ctx.restore();
        });
      }

      function drawVirtualJoystick() {
        if (joystick.active) {
          ctx.save();
          ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
          ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
          ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.arc(joystick.originX, joystick.originY, joystick.maxRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath(); ctx.arc(joystick.currX, joystick.currY, 22, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        } else {
          // Idle translucent white glass joystick ring + inner knob centered around hero waist (never covering face!)
          const zoom = getWorldZoom();
          const jx = (player.x - camera.x) * zoom;
          const jy = (player.y - camera.y) * zoom + 14;
          ctx.save();
          ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
          ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
          ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.arc(jx, jy, 42, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = "rgba(255, 255, 255, 0.36)";
          ctx.strokeStyle = "rgba(255, 255, 255, 0.68)";
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(jx, jy, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      }

      function refreshDrawerAvailability() {
        if (!drawerOpen) return;
        drawerBody.querySelectorAll("[data-upg]").forEach((btn) => {
          const id = btn.dataset.upg;
          let canBuy = false, isMax = false;
          if (id.startsWith("stat_")) { const lv = state.stats[id.slice(5)]; isMax = lv >= 25; canBuy = state.gems >= statUpgradeCost(lv); }
          else if (id === "hire_fairy_btn") { isMax = getTotalFairies() >= 15; canBuy = state.gems >= fairyHireCost(state.hiredFairies); }
          else if (id === "refinery_btn") { isMax = state.refineryBuilt && state.refineryLevel >= 15; canBuy = state.gems >= (state.refineryBuilt ? refineryUpgradeCost(state.refineryLevel) : 600); }
          else if (id === "cauldron_btn") { isMax = state.cauldronLevel >= 15; canBuy = state.gems >= cauldronUpgradeCost(state.cauldronLevel); }
          else if (id.startsWith("zone_btn_")) { const zi = Number(id.slice(9)); isMax = !!state.unlockedZones[zi]; canBuy = state.gems >= ZONES[zi].unlockCost; }
          else if (id.startsWith("turret_btn_")) {
            const pad = stepPads.find((p) => p.id === id.slice(11));
            if (pad) { isMax = pad.isDone(); const cost = pad.getCost(); canBuy = pad.currency === "crystals" ? state.crystals >= cost : state.gems >= cost; }
          } else if (id.startsWith("relic_")) { const lv = state.relics[id.slice(6)]; isMax = lv >= 15; canBuy = state.starShards >= relicUpgradeCost(lv); }
          btn.disabled = isMax || !canBuy;
        });
      }

      drawerBody.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-upg]");
        if (!btn) return;
        const id = btn.dataset.upg;
        if (id.startsWith("stat_")) {
          const key = id.slice(5), lv = state.stats[key], cost = statUpgradeCost(lv);
          if (lv < 25 && state.gems >= cost) { state.gems -= cost; state.stats[key]++; SoundEngine.playBuildPop(); renderDrawer(); }
        } else if (id === "hire_fairy_btn") {
          const cost = fairyHireCost(state.hiredFairies);
          if (getTotalFairies() < 15 && state.gems >= cost) { state.gems -= cost; state.hiredFairies++; syncWorkersAndCarts(); SoundEngine.playBuildPop(); renderDrawer(); }
        } else if (id === "refinery_btn") {
          const cost = state.refineryBuilt ? refineryUpgradeCost(state.refineryLevel) : 600;
          if (state.gems >= cost) { state.gems -= cost; if (!state.refineryBuilt) state.refineryBuilt = true; else if (state.refineryLevel < 15) state.refineryLevel++; SoundEngine.playBuildPop(); renderDrawer(); }
        } else if (id === "cauldron_btn") {
          const cost = cauldronUpgradeCost(state.cauldronLevel);
          if (state.cauldronLevel < 15 && state.gems >= cost) { state.gems -= cost; state.cauldronLevel++; SoundEngine.playBuildPop(); renderDrawer(); }
        } else if (id.startsWith("zone_btn_")) {
          const zi = Number(id.slice(9)), cost = ZONES[zi].unlockCost;
          if (!state.unlockedZones[zi] && state.gems >= cost) { state.gems -= cost; const pad = stepPads.find((p) => p.id === `zone_${zi}`); if (pad) pad.onComplete(); renderDrawer(); }
        } else if (id.startsWith("turret_btn_")) {
          const pad = stepPads.find((p) => p.id === id.slice(11));
          if (!pad || pad.isDone()) return;
          const cost = pad.getCost();
          if ((pad.currency === "crystals" && state.crystals >= cost) || (pad.currency === "gems" && state.gems >= cost)) {
            if (pad.currency === "crystals") state.crystals -= cost; else state.gems -= cost;
            pad.onComplete(); renderDrawer();
          }
        } else if (id.startsWith("relic_")) {
          const rk = id.slice(6), lv = state.relics[rk], cost = relicUpgradeCost(lv);
          if (lv < 15 && state.starShards >= cost) { state.starShards -= cost; state.relics[rk]++; SoundEngine.playLevelUp(); renderDrawer(); }
        }
      });

      });

      function saveGame(silent = true) {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
          if (!silent) showToast("💾 게임 진행 상태가 저장되었습니다!");
        } catch (_) {}
      }

      function loadGame() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          const fresh = createInitialState();
          state = {
            ...fresh,
            ...parsed,
            stats: { ...fresh.stats, ...(parsed.stats || {}) },
            relics: { ...fresh.relics, ...(parsed.relics || {}) },
            turrets: parsed.turrets || {}
          };
          SoundEngine.muted = !!state.muted;
          updateMuteIcon();
        } catch (_) {}
      }

      document.getElementById("btn-save").addEventListener("click", () => saveGame(false));

      const resetModal = document.getElementById("reset-modal");
      document.getElementById("btn-reset").addEventListener("click", () => resetModal.classList.add("open"));
      document.getElementById("btn-cancel-reset").addEventListener("click", () => resetModal.classList.remove("open"));
      document.getElementById("btn-confirm-reset").addEventListener("click", () => {
        localStorage.removeItem(SAVE_KEY);
        state = createInitialState();
        activeBoss = null; monsters.length = 0; customers.length = 0;
        player.x = 0; player.y = 35; player.hp = 120;
        const rz = getWorldZoom();
        camera.x = player.x - (viewW * 0.5) / rz;
        camera.y = player.y - 24 - (viewH * 0.5) / rz;
        seedWorld(); syncWorkersAndCarts();
        resetModal.classList.remove("open");
        updateHUD();
        if (drawerOpen) renderDrawer();
        showToast("✨ 새로운 모험이 초기화되었습니다!");
      });

      loadGame();
      seedWorld();
      syncWorkersAndCarts();
      const bootZoom = getWorldZoom();
      camera.x = player.x - (viewW * 0.5) / bootZoom;
      camera.y = player.y - 24 - (viewH * 0.5) / bootZoom;
      setInterval(() => saveGame(true), 10000);

      let lastTime = performance.now(), fpsFrames = 0, fpsTimer = 0, hudTick = 0;
      function frame(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        update(dt);
        drawWorldBackground();
        drawVirtualJoystick();
        fpsFrames++; fpsTimer += dt;
        if (fpsTimer >= 0.5) { currentFps = Math.round(fpsFrames / fpsTimer); fpsFrames = 0; fpsTimer = 0; }
        hudTick += dt;
        if (hudTick >= 0.12) { hudTick = 0; updateHUD(); if (drawerOpen) refreshDrawerAvailability(); }
        requestAnimationFrame(frame);
      }

      updateHUD();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
